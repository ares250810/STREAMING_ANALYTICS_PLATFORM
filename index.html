<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GRID streaming</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="grid-container">
        <header class="header">
            <div class="LOGO"></div>
            <div class="SEARCH"></div>
            <div class="NOTIFICATION"></div>
            <div class="USER_PROFILE"></div>  
        </header>
    </div>
    <div class="layout_principal">
        <aside class="sidebar">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Trending</a></li>
                <li><a href="#">Gaming</a></li>
                <li><a href="#">Music</a></li>
                <li><a href="#">Settings</a></li>
            </ul>
        </aside>
        <main class="MAIN-CONTENT">
            <div class="FEATURED"></div>
            <div class="grid-stats">
                <div class="card-stats">S1</div>
                <div class="card-stats">S2</div>
                <div class="card-stats">S3</div>
                <div class="card-stats">S4</div>
            </div>
            <div class="content-grid">
                <div class="card-content">C1</div>
                <div class="card-content">C2</div>
                <div class="card-content">C3</div>
                <div class="card-content">C4</div>
                <div class="card-content">C5</div>
                <div class="card-content">C6</div>
            </div>
            <div class="activity-table">
                <table>
                    <thead>
                        <tr>
                            <th>Activity</th>
                            <th>Status</th>
                            <th>Time</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Stream Started</td>
                            <td>Live</td>
                            <td>10:00 AM</td>
                        </tr>
                        <tr>
                            <td>New Follower</td>
                            <td>JohnDoe</td>
                            <td>10:05 AM</td>
                        </tr>
                        <tr>
                            <td>Stream Ended</td>
                            <td>Offline</td>
                            <td>11:00 AM</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
        <div class="chat">
            <div class="chat-mensajes">
                <p>mensajes</p>
            </div>
        </div>
        <footer class="footer">
            <p>&copy; 2024 GRID Streaming. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
